name: Generate Snake

# Controla quando a action vai rodar
on:
  schedule:
    # Roda todo dia à meia-noite
    - cron: "0 0 * * *"
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          # Puxa o nome do usuário automaticamente
          github_user_name: ${{ github.repository_owner }}
          # Gera os arquivos na pasta dist
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Faz o push das imagens geradas para a branch "output"
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
